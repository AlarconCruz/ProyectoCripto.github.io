<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>La Segunda Guerra Mundial — Iniciar sesión</title>
    <link rel="shortcut icon" href="img/union.png" type="image/x-icon" />
    <link href="css/Login_Registro.css" rel="stylesheet" type="text/css">
    <style>
        .error-msg {
            color: #c0392b;
            font-size: 13px;
            margin-top: 4px;
            display: none;
            margin-left: 10%;
        }
        .exito-msg {
            color: #27ae60;
            font-size: 15px;
            text-align: center;
            display: none;
            padding: 8px;
            border: 1px solid #27ae60;
            border-radius: 5px;
            margin: 10px 10%;
            background: #eafaf1;
        }
        .bloqueo-msg {
            color: #c0392b;
            font-size: 14px;
            text-align: center;
            display: none;
            padding: 10px;
            border: 1px solid #c0392b;
            border-radius: 5px;
            margin: 10px 10%;
            background: #fdf2f2;
            font-weight: bold;
        }
        .aviso-redirect {
            font-size: 13px;
            color: #555;
            background: #fef9e7;
            border: 1px solid #f0c040;
            border-radius: 5px;
            padding: 8px 12px;
            margin: 0 10% 12px 10%;
            display: none;
        }
        #contador-bloqueo {
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1 style="background-color: var(--titulo); margin: 0px; padding: 20px; color: #FFF">
        <a class="inicio" href="index.html">La Segunda Guerra Mundial</a>
    </h1>

    <div class="contenedor">
        <div class="formulario">
            <h1>Iniciar sesión</h1>

            <!-- Aviso cuando viene redirigido desde una página protegida -->
            <p class="aviso-redirect" id="aviso-redirect">
                🔒 Debes iniciar sesión para acceder al mapa interactivo.
            </p>

            <!-- Aviso de bloqueo -->
            <div class="bloqueo-msg" id="msg-bloqueo">
                🔒 Cuenta bloqueada.<br>
                Intenta de nuevo en <span id="contador-bloqueo">120</span> segundos.
            </div>

            <div class="input-contenedor">
                <input class="input-text" type="text" id="correo"
                       placeholder="Usuario UNAL (sin @unal.edu.co)"
                       maxlength="60" autocomplete="off">
            </div>
            <p class="error-msg" id="error-correo"></p>

            <div class="input-contenedor">
                <input class="input-text" type="password" id="password"
                       placeholder="Contraseña" maxlength="64">
            </div>
            <p class="error-msg" id="error-password"></p>

            <p class="error-msg" id="error-general"></p>
            <p class="exito-msg" id="msg-exito"></p>

            <button class="button" id="btn-login" onclick="handleLogin()">
                Iniciar sesión
            </button>

            <p>Al iniciar sesión aceptas nuestras Condiciones de uso y Política de privacidad.</p>
            <p>¿No tienes cuenta? <a class="link" href="registro.html">Regístrate</a></p>
        </div>
    </div>

    <script src="javascript/auth.js"></script>
    <script>
        let intervaloBloqueo = null;

        window.addEventListener('load', function () {
            // Mostrar aviso si viene redirigido desde página protegida
            const params = new URLSearchParams(window.location.search);
            if (params.get('redirect')) {
                document.getElementById('aviso-redirect').style.display = 'block';
            }
            verificarEstadoBloqueo();
        });

        function verificarEstadoBloqueo() {
            if (estaBloqueado()) mostrarPantallaBloqueo();
        }

        function mostrarPantallaBloqueo() {
            document.getElementById('msg-bloqueo').style.display = 'block';
            document.getElementById('btn-login').disabled = true;
            document.querySelectorAll('.input-text').forEach(i => i.disabled = true);
            actualizarContador();
            if (intervaloBloqueo) clearInterval(intervaloBloqueo);
            intervaloBloqueo = setInterval(function () {
                if (!estaBloqueado()) {
                    clearInterval(intervaloBloqueo);
                    desbloquearFormulario();
                } else {
                    actualizarContador();
                }
            }, 1000);
        }

        function actualizarContador() {
            document.getElementById('contador-bloqueo').textContent = tiempoRestanteBloqueoBloqueado();
        }

        function desbloquearFormulario() {
            document.getElementById('msg-bloqueo').style.display = 'none';
            document.getElementById('btn-login').disabled = false;
            document.querySelectorAll('.input-text').forEach(i => i.disabled = false);
        }

        async function handleLogin() {
            ['error-correo', 'error-password', 'error-general', 'msg-exito'].forEach(id => {
                const el = document.getElementById(id);
                el.style.display = 'none';
                el.textContent = '';
            });

            if (estaBloqueado()) { mostrarPantallaBloqueo(); return; }

            const correo   = document.getElementById('correo').value.trim();
            const password = document.getElementById('password').value;

            let hayError = false;
            if (!correo)    { mostrarError('error-correo',   'El correo es obligatorio.'); hayError = true; }
            if (!password)  { mostrarError('error-password', 'La contraseña es obligatoria.'); hayError = true; }
            if (hayError) return;

            const btn = document.getElementById('btn-login');
            btn.disabled = true;
            btn.textContent = 'Verificando...';

            const resultado = await loginUsuario(correo, password);

            btn.disabled = false;
            btn.textContent = 'Iniciar sesión';

            if (resultado.ok) {
                // Guardar sesión activa
                iniciarSesion(resultado.usuario.correo);

                const exito = document.getElementById('msg-exito');
                exito.textContent = '¡Bienvenido! Redirigiendo...';
                exito.style.display = 'block';

                // Volver a la página desde donde vino, o al inicio
                const params = new URLSearchParams(window.location.search);
                const destino = params.get('redirect') || 'index.html';
                setTimeout(() => { window.location.href = destino; }, 1500);
            } else if (resultado.bloqueado) {
                mostrarPantallaBloqueo();
            } else {
                mostrarError('error-general', resultado.msg);
            }
        }
    </script>
</body>
</html>
