<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>La Segunda Guerra Mundial — Registro</title>
    <link rel="shortcut icon" href="img/union.png" type="image/x-icon" />
    <link href="css/Login_Registro.css" rel="stylesheet" type="text/css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        .error-msg {
            color: #c0392b;
            font-size: 13px;
            margin-top: 4px;
            display: none;
            margin-left: 10%;
        }
        .exito-msg {
            color: #27ae60;
            font-size: 15px;
            text-align: center;
            display: none;
            padding: 8px;
            border: 1px solid #27ae60;
            border-radius: 5px;
            margin: 10px 10%;
            background: #eafaf1;
        }
        .captcha-contenedor {
            margin: 0 0 15px 10%;
        }
        .password-hint {
            font-size: 12px;
            color: #777;
            margin-left: 10%;
            margin-top: -10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1 style="background-color: var(--titulo); margin: 0px; padding: 20px; color: #FFF">
        <a class="inicio" href="index.html">La Segunda Guerra Mundial</a>
    </h1>

    <div class="contenedor">
        <div class="formulario">
            <h1>Regístrate</h1>

            <div class="input-contenedor">
                <input class="input-text" type="text" id="correo"
                       placeholder="Usuario UNAL (sin @unal.edu.co)"
                       maxlength="60" autocomplete="off">
            </div>
            <p class="error-msg" id="error-correo"></p>

            <div class="input-contenedor">
                <input class="input-text" type="password" id="password"
                       placeholder="Contraseña" maxlength="64" autocomplete="new-password">
            </div>
            <p class="password-hint">Mínimo 8 caracteres, 1 mayúscula, 1 número y 1 símbolo (ej. !@#$)</p>
            <p class="error-msg" id="error-password"></p>

            <div class="input-contenedor">
                <input class="input-text" type="password" id="password2"
                       placeholder="Confirmar contraseña" maxlength="64">
            </div>
            <p class="error-msg" id="error-password2"></p>

            <div class="captcha-contenedor">
                <div class="g-recaptcha"
                     data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI">
                </div>
            </div>
            <p class="error-msg" id="error-captcha"></p>

            <p class="exito-msg" id="msg-exito"></p>

            <button class="button" id="btn-registrar" onclick="handleRegistro()">
                Regístrate
            </button>

            <p>Al registrarte aceptas nuestras Condiciones de uso y Política de privacidad.</p>
            <p>¿Ya tienes cuenta? <a class="link" href="login.html">Iniciar sesión</a></p>
        </div>
    </div>

    <script src="javascript/auth.js"></script>
    <script>
        async function handleRegistro() {
            ['error-correo', 'error-password', 'error-password2', 'error-captcha', 'msg-exito'].forEach(id => {
                const el = document.getElementById(id);
                el.style.display = 'none';
                el.textContent = '';
            });

            const correo    = document.getElementById('correo').value.trim();
            const password  = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;

            let hayError = false;

            if (!correo) {
                mostrarError('error-correo', 'El correo es obligatorio.');
                hayError = true;
            } else if (!validarCorreo(correo)) {
                mostrarError('error-correo', 'Correo inválido. Usa tu usuario UNAL (con o sin @unal.edu.co).');
                hayError = true;
            }

            if (!password) {
                mostrarError('error-password', 'La contraseña es obligatoria.');
                hayError = true;
            } else if (!validarPassword(password)) {
                mostrarError('error-password', 'Mínimo 8 caracteres, 1 mayúscula, 1 número y 1 símbolo especial.');
                hayError = true;
            }

            if (password !== password2) {
                mostrarError('error-password2', 'Las contraseñas no coinciden.');
                hayError = true;
            }

            // RNF 1: Verificar CAPTCHA
            const captchaResponse = grecaptcha.getResponse();
            if (!captchaResponse) {
                mostrarError('error-captcha', 'Por favor completa el CAPTCHA.');
                hayError = true;
            }

            if (hayError) return;

            const btn = document.getElementById('btn-registrar');
            btn.disabled = true;
            btn.textContent = 'Registrando...';

            const resultado = await registrarUsuario(correo, password);

            btn.disabled = false;
            btn.textContent = 'Regístrate';
            grecaptcha.reset();

            if (resultado.ok) {
                const exito = document.getElementById('msg-exito');
                exito.textContent = resultado.msg;
                exito.style.display = 'block';
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
            } else {
                mostrarError('error-correo', resultado.msg);
            }
        }
    </script>
</body>
</html>
